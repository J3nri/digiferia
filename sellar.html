<!DOCTYPE html>
<html lang="es">
<head>
<!-- La Digi Feria · sellar v1 — Sumar sello (Tarjeta Digi Feria) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sumar sello · La Digi Feria</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fucsia:#E91E8C; --naranja:#FF7A00; --amarillo:#FFC93C;
  --verde:#00A878; --celeste:#2D9CDB; --tinta:#2B2118;
  --fondo:#FFF8EC; --blanco:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#EFE6D5;color:var(--tinta);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
.hoja{width:100%;max-width:440px}

.cab{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px}
.cab h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;flex:1}
.cab a{color:#7A6A55;font-weight:800;font-size:13px;text-decoration:none}

.chapa{display:inline-block;border:3px solid var(--tinta);border-radius:12px;
  box-shadow:3px 3px 0 rgba(43,33,24,.9);padding:7px 12px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px}
.chapa.si{background:var(--verde);color:#fff}
.chapa.no{background:#E4DACA;color:#6B5C48}

.card{background:#FFF1DC;
  background-image:linear-gradient(rgba(43,33,24,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(43,33,24,.055) 1px,transparent 1px);
  background-size:22px 22px;border:3px solid var(--tinta);border-radius:18px;
  box-shadow:5px 5px 0 rgba(43,33,24,.9);padding:18px;margin-bottom:14px}

label.lbl{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
.inp{width:100%;background:var(--blanco);border:3px solid var(--tinta);border-radius:12px;
  box-shadow:3px 3px 0 rgba(43,33,24,.9);padding:14px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:var(--tinta)}
.inp::placeholder{color:#B5A794;font-weight:700}
.ayuda{font-size:12px;color:#7A6A55;font-weight:700;margin-top:6px}

.tilde{display:flex;gap:11px;align-items:flex-start;background:var(--blanco);
  border:3px solid var(--tinta);border-radius:12px;box-shadow:3px 3px 0 rgba(43,33,24,.9);
  padding:13px;margin-top:14px;cursor:pointer}
.tilde input{position:absolute;opacity:0;pointer-events:none}
.tilde .caja{width:28px;height:28px;flex:0 0 28px;border:3px solid var(--tinta);
  border-radius:8px;background:var(--blanco);display:flex;align-items:center;
  justify-content:center;font-size:19px;color:var(--tinta);line-height:1}
.tilde input:checked + .caja{background:var(--amarillo)}
.tilde input:checked + .caja::after{content:"✓";font-weight:800}
.tilde b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15.5px}
.tilde small{display:block;font-size:12.5px;color:#7A6A55;font-weight:700;margin-top:2px}
.pro{display:inline-block;background:var(--tinta);color:#fff;border-radius:7px;
  padding:2px 7px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}

.btn{width:100%;background:var(--fucsia);color:#fff;border:3px solid var(--tinta);
  border-radius:14px;box-shadow:4px 4px 0 rgba(43,33,24,.9);padding:17px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;cursor:pointer;margin-top:16px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(43,33,24,.9)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.verde{background:var(--verde)}
.btn.blanco{background:var(--blanco);color:var(--tinta);font-size:16px;padding:13px}

.pie{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
  padding-top:13px;border-top:1px dashed #C9B89A}
.pie button{background:none;border:none;color:#7A6A55;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:13px;cursor:pointer;padding:4px}
.pie button:disabled{opacity:.4;cursor:default}

/* resultado */
.banda{background:var(--verde);color:#fff;border:3px solid var(--tinta);border-radius:14px;
  box-shadow:4px 4px 0 rgba(43,33,24,.9);padding:14px;text-align:center;margin-bottom:14px}
.banda b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px}
.banda span{font-size:14px;font-weight:700;opacity:.95}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.marcador{background:var(--blanco);border:3px solid var(--tinta);border-radius:14px;
  box-shadow:3px 3px 0 rgba(43,33,24,.9);padding:13px;text-align:center}
.marcador.propia{background:var(--amarillo)}
.marcador .t{font-size:12.5px;color:#6B5C48;font-weight:800;line-height:1.3}
.marcador .n{font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;margin:3px 0}
.marcador .n.cero{color:#A8977F}
.marcador .d{font-size:12px;font-weight:800;color:#6B5C48}
.aviso{background:#FCE3C6;border:2px dashed var(--tinta);border-radius:12px;padding:11px 13px;
  font-size:13px;font-weight:700;margin-top:13px;line-height:1.4}
.festejo{background:var(--amarillo);border:3px solid var(--tinta);border-radius:14px;
  box-shadow:3px 3px 0 rgba(43,33,24,.9);padding:13px;text-align:center;margin-top:13px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px}

.msg{font-size:14px;font-weight:700;line-height:1.5}
.msg b{font-family:'Fredoka',sans-serif;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--tinta);
  color:#fff;padding:13px 20px;border-radius:12px;font-weight:800;font-size:14px;
  max-width:92%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.cargando{text-align:center;padding:40px 0;font-weight:800;color:#7A6A55}
</style>
</head>
<body>

<div class="hoja">
  <div class="cab">
    <h1>Sumar sello 🎟️</h1>
    <a href="index.html">← Mi panel</a>
  </div>
  <div id="app"><div class="cargando">Cargando…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://msbtiihlcgiycorskkdt.supabase.co";
const SUPABASE_KEY = "sb_publishable_eM5s_vC0_StPCC7sWlYFmQ_gEzvi46A";

let token = null, puesto = null, ctx = null, ultimoEvento = null;
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 1123456789 -> "11 2345-6789"  ·  2214567890 -> "221 456-7890"
function telLindo(t){
  const d = String(t||'').replace(/\D/g,'');
  if(d.length !== 10) return t;
  const area = d.startsWith('11') ? 2 : 3;
  const resto = d.slice(area);
  return d.slice(0,area) + ' ' + resto.slice(0, resto.length-4) + '-' + resto.slice(-4);
}

// El cliente no sabe de capas: el mensaje habla de SU tarjeta de la feria,
// y menciona la del puesto aparte, como dice el reglamento.
function mensajeWhatsApp(r){
  const f = r.feria, p = r.puesto;
  let t = `¡Hola ${r.cliente.nombre}! `;
  if(f.suma) t += `Sumaste ${f.suma} sello en tu Tarjeta Digi Feria: ya tenés ${f.total} de ${f.umbral}. `;
  else       t += `Gracias por tu compra en ${puesto.nombre}. `;
  if(p && p.suma) t += `Y en la tarjeta de ${puesto.nombre} sumaste ${p.suma}: vas ${p.total} de ${p.umbral}. `;
  if(f.completa) t += `¡Completaste la tarjeta de la feria! Tenés hasta el ${f.canjear_hasta} para elegir dónde canjear tu descuento. `;
  else if(p && p.completa) t += `¡Completaste la tarjeta de ${puesto.nombre}! `;
  return encodeURIComponent(t.trim());
}

let tToast;
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tToast); tToast = setTimeout(()=>t.classList.remove('on'), 3200);
}

function cab(tk){
  return { apikey:SUPABASE_KEY, Authorization:`Bearer ${tk||SUPABASE_KEY}`,
           "Content-Type":"application/json" };
}

// Llama a la Edge Function. Toda la lógica de sellado vive allá:
// desde acá no se consultan clientes, tarjetas ni sellos.
async function fn(body){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/tf-sellar`, {
    method:'POST', headers:cab(token), body:JSON.stringify({ ...body, puesto_id:puesto?.id })
  });
  return await r.json();
}

// ================== ARRANQUE ==================
(async function inicio(){
  try{ token = localStorage.getItem('df_token'); }catch(e){}
  if(!token) return pantallaLogin();

  const r = await fetch(`${SUPABASE_URL}/rest/v1/puestos?usuario_id=eq.${localStorage.getItem('df_uid')}&select=id,nombre,plan,whatsapp`, { headers:cab(token) });
  if(r.status === 401){ try{ localStorage.removeItem('df_token'); }catch(e){} return pantallaLogin(); }
  const ps = r.ok ? await r.json() : [];
  if(!ps.length) return pantallaSinPuesto();
  puesto = ps[0];

  ctx = await fn({ accion:'estado' });
  if(!ctx.ok) return pantallaError(ctx.motivo);
  pantallaSellar();
})();

// ================== PANTALLAS ==================
function pantallaLogin(){
  app.innerHTML = `<div class="card">
    <p class="msg" style="margin-bottom:14px">Entrá con tu cuenta de feriante para sellar.</p>
    <label class="lbl" for="em">Email</label>
    <input class="inp" id="em" type="email" inputmode="email" autocomplete="username" style="font-size:16px">
    <label class="lbl" for="pw" style="margin-top:13px">Contraseña</label>
    <input class="inp" id="pw" type="password" autocomplete="current-password" style="font-size:16px">
    <button class="btn" id="bl" onclick="entrar(this)">Entrar</button>
  </div>`;
  document.getElementById('pw').addEventListener('keydown', e=>{
    if(e.key === 'Enter') entrar(document.getElementById('bl'));
  });
}

async function entrar(btn){
  const email = document.getElementById('em').value.trim();
  const pass  = document.getElementById('pw').value;
  if(!email || !pass) return toast('Completá email y contraseña.');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email, password:pass })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || 'Credenciales incorrectas');
    localStorage.setItem('df_token', d.access_token);
    localStorage.setItem('df_uid', d.user.id);
    location.reload();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Entrar';
    toast(e.message);
  }
}

function pantallaSinPuesto(){
  app.innerHTML = `<div class="card"><p class="msg">Tu cuenta todavía no tiene un puesto aprobado.
    Cuando lo tengas, vas a poder sellar desde acá.</p></div>`;
}
function pantallaError(motivo){
  app.innerHTML = `<div class="card"><p class="msg">No pudimos preparar la pantalla.<br>
    <small style="color:#7A6A55">(${esc(motivo)})</small></p>
    <button class="btn blanco" onclick="location.reload()">Reintentar</button></div>`;
}

function pantallaSellar(){
  // Sin jornada de feria hoy no se sella: es la regla del reglamento.
  if(!ctx.hay_feria_hoy){
    app.innerHTML = `<div class="card" style="text-align:center">
      <div class="chapa no" style="margin-bottom:14px">Hoy no hay feria</div>
      <p class="msg">Los sellos se cargan solamente los días que tu feria está en el calendario.
      Volvé el próximo día de feria.</p>
    </div>`;
    return;
  }
  if(!ctx.adherido){
    app.innerHTML = `<div class="card">
      <p class="msg">Tu puesto todavía no está sumado a la Tarjeta de <b>${esc(ctx.feria)}</b>.</p>
      <p class="msg" style="margin-top:10px;color:#7A6A55">Sumate desde la solapa Tarjeta de tu panel y volvé.</p>
      <button class="btn blanco" onclick="location.href='index.html'">Ir a mi panel</button>
    </div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
        <span class="chapa si">Hoy hay feria</span>
      </div>
      <label class="lbl" for="tel">Teléfono del cliente</label>
      <input class="inp" id="tel" type="tel" inputmode="numeric" autocomplete="off"
             placeholder="11 2345-6789" enterkeyhint="done">
      <div class="ayuda">Como te lo diga: con o sin 15, con o sin +54.</div>

      ${ctx.es_pro ? `
      <label class="tilde">
        <input type="checkbox" id="grande"><span class="caja"></span>
        <span><b>Compra grande</b><span class="pro">Pro</span>
        <small>Suma un 2º sello a la tarjeta de tu puesto</small></span>
      </label>` : ''}

      <button class="btn" id="bs" onclick="sellar(this)">Sumar sello</button>

      <div class="pie">
        <button id="bd" onclick="deshacer(this)">↩ Deshacer último sello</button>
        <span style="font-size:12px;color:#9A8B76;font-weight:800">${esc(puesto.nombre)}</span>
      </div>
    </div>`;

  const tel = document.getElementById('tel');
  tel.focus();
  tel.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); sellar(document.getElementById('bs')); }
  });
}

// ================== SELLAR ==================
async function sellar(btn){
  const telInp = document.getElementById('tel');
  const telefono = telInp.value.trim();
  if(telefono.replace(/\D/g,'').length < 10) return toast('Escribí el teléfono completo, con característica.');
  const grandeEl = document.getElementById('grande');

  btn.disabled = true; btn.textContent = 'Sellando…';
  try{
    const r = await fn({ accion:'sellar', telefono, compra_grande: !!(grandeEl && grandeEl.checked) });

    if(!r.ok){
      if(r.motivo === 'cliente_no_existe') return pantallaClienteNuevo(telefono);
      toast(textoMotivo(r.motivo, r.detalle));
      btn.disabled = false; btn.textContent = 'Sumar sello';
      return;
    }
    ultimoEvento = r.evento_id;
    pantallaResultado(r);
  }catch(e){
    btn.disabled = false; btn.textContent = 'Sumar sello';
    toast('No se pudo sellar. Fijate la señal y probá de nuevo.');
  }
}

function textoMotivo(m, detalle){
  const t = {
    no_hay_feria_hoy:  'Hoy no hay feria: no se pueden cargar sellos.',
    feria_sin_programa:'La Tarjeta todavía no está activa en esta feria.',
    no_adherido:       'Tu puesto no está sumado a la Tarjeta de esta feria.',
    telefono_invalido: 'Ese teléfono no parece completo.',
    puesto_ajeno:      'Ese puesto no es tuyo.',
    sin_sesion:        'Se cerró tu sesión. Volvé a entrar.',
    nada_que_deshacer: 'No hay ningún sello reciente para deshacer.',
    ya_no_es_el_ultimo:'Ese ya no es el último sello.',
  };
  return t[m] || ('No se pudo: ' + (detalle || m));
}

function pantallaClienteNuevo(telefono){
  const solo = telefono.replace(/\D/g,'').slice(-10);
  const texto = encodeURIComponent(
    `¡Hola! Te invito a la Tarjeta Digi Feria: juntás sellos comprando en los puestos de la feria y después elegís dónde canjear tu descuento. Anotate acá y te sumo el sello: https://digiferia.ar`);
  app.innerHTML = `<div class="card">
    <p class="msg"><b>Ese teléfono todavía no está en la Tarjeta.</b></p>
    <p class="msg" style="margin-top:9px;color:#5C4F3E">El alta la tiene que hacer el cliente,
    porque es él quien acepta los términos. Son 30 segundos: mandale el link o mostrale tu QR,
    y apenas termina volvés y le sellás.</p>
    <a class="btn verde" style="display:block;text-align:center;text-decoration:none"
       href="https://wa.me/549${solo}?text=${texto}" target="_blank" rel="noopener">
       Mandarle el link por WhatsApp</a>
    <button class="btn blanco" onclick="pantallaSellar()">Volver a sellar</button>
  </div>`;
}

// ================== RESULTADO ==================
function pantallaResultado(r){
  const f = r.feria, p = r.puesto;
  const festejo = (f && f.completa) || (p && p.completa);

  const marcador = (titulo, info, clase) => {
    if(!info) return '';
    return `<div class="marcador ${clase}">
      <div class="t">${titulo}</div>
      <div class="n ${info.suma ? '' : 'cero'}">${info.suma ? '+' + info.suma : '0'}</div>
      <div class="d">${info.total} de ${info.umbral}</div>
    </div>`;
  };

  const msgWa = mensajeWhatsApp(r);

  app.innerHTML = `
    <div class="banda">
      <b>✓ Sello${(f.suma + (p?p.suma:0)) === 1 ? '' : 's'} sumado${(f.suma + (p?p.suma:0)) === 1 ? '' : 's'}</b>
      <span>${esc(telLindo(r.cliente.telefono))} · ${esc(r.cliente.nombre)}</span>
    </div>

    <div class="dos">
      ${marcador('Tarjeta de la feria', f, '')}
      ${marcador('Tarjeta de tu puesto', p, 'propia')}
    </div>

    ${festejo ? `<div class="festejo">🎉 ¡${esc(r.cliente.nombre)} completó la tarjeta!<br>
      <span style="font-size:13px;font-family:'Nunito';font-weight:700">
      Tiene hasta el ${esc(f.canjear_hasta || (p && p.canjear_hasta) || '')} para canjear.</span></div>` : ''}

    ${(r.avisos||[]).map(a=>`<div class="aviso">ⓘ ${esc(a)}</div>`).join('')}

    <a class="btn verde" style="display:block;text-align:center;text-decoration:none"
       href="https://wa.me/549${esc(r.cliente.telefono)}?text=${msgWa}" target="_blank" rel="noopener">
       Avisarle por WhatsApp</a>
    <button class="btn blanco" onclick="pantallaSellar()">Sellar a otro cliente</button>
    <div class="pie">
      <button onclick="deshacer(this)">↩ Deshacer este sello</button>
    </div>`;
}

// ================== DESHACER ==================
async function deshacer(btn){
  if(!confirm('¿Deshacer el último sello que cargaste?\n\nLos sellos se le quitan al cliente. Queda registrado que se deshizo.')) return;
  btn.disabled = true;
  try{
    const r = await fn({ accion:'deshacer' });
    if(!r.ok){ toast(textoMotivo(r.motivo, r.detalle)); btn.disabled = false; return; }
    ultimoEvento = null;
    toast(`Listo: se quitaron ${r.sellos_quitados} sello${r.sellos_quitados===1?'':'s'}.`);
    pantallaSellar();
  }catch(e){
    btn.disabled = false;
    toast('No se pudo deshacer. Probá de nuevo.');
  }
}
</script>
</body>
</html>
