<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — La Digi Feria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --fucsia:#E91E8C; --naranja:#FF7A00; --amarillo:#FFC93C;
  --verde:#00A878; --celeste:#2D9CDB; --tinta:#2B2118;
  --fondo:#FFF8EC; --blanco:#FFFFFF; --radius:18px;
  --wsp:#25D366;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#EFE6D5;color:var(--tinta);min-height:100vh}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--fondo);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(43,33,24,.15)}
.banderines{display:flex;height:18px;overflow:hidden}
.banderines span{flex:1;min-width:20px;clip-path:polygon(0 0,100% 0,50% 100%)}
.banderines span:nth-child(5n+1){background:var(--fucsia)}
.banderines span:nth-child(5n+2){background:var(--amarillo)}
.banderines span:nth-child(5n+3){background:var(--verde)}
.banderines span:nth-child(5n+4){background:var(--naranja)}
.banderines span:nth-child(5n+5){background:var(--celeste)}
header{background:var(--tinta);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;color:var(--amarillo)}
.logo span{color:var(--blanco)}
.badge-admin{font-size:11px;font-weight:800;background:var(--fucsia);color:#fff;border-radius:999px;padding:3px 10px}
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:16px}
.login h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px}
.login input{width:100%;border:2px solid var(--tinta);border-radius:12px;padding:12px 14px;font-family:'Nunito',sans-serif;font-size:15px;background:var(--blanco);outline:none}
.login input:focus{border-color:var(--fucsia)}
.login .btn{width:100%;padding:14px;background:var(--fucsia);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;border:2px solid var(--tinta);border-radius:12px;cursor:pointer;box-shadow:4px 4px 0 rgba(43,33,24,.9)}
.login .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,33,24,.9)}
.login .error{font-size:13px;font-weight:800;color:var(--fucsia)}
.panel{display:none;flex:1;flex-direction:column}
.panel.on{display:flex}
.panel-header{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.contador{font-size:13px;font-weight:800;background:#FDE7F2;border:2px solid var(--tinta);border-radius:999px;padding:3px 12px;color:var(--fucsia)}
.tabs-main{display:flex;gap:8px;padding:0 18px 12px}
.tab-main{flex:1;padding:11px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;cursor:pointer;border:2px solid var(--tinta);border-radius:12px;background:var(--blanco);color:var(--tinta);box-shadow:3px 3px 0 rgba(43,33,24,.9);transition:background .12s}
.tab-main.on{background:var(--tinta);color:var(--amarillo);box-shadow:none}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--tinta);margin:0 18px}
/* ---- Panel de salud ---- */
.sal-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 0 13px}
.sal-chip{background:var(--blanco);border:2px solid var(--tinta);border-radius:11px;padding:6px 4px;text-align:center}
.sal-chip b{font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;display:block;line-height:1}
.sal-chip small{font-size:9.5px;font-weight:800;color:#5C4F3E;display:block;margin-top:2px;letter-spacing:.2px}
.sal-card{background:var(--blanco);border:2px solid var(--tinta);border-radius:12px;box-shadow:2px 2px 0 rgba(43,33,24,.9);padding:8px 10px;margin-bottom:7px}
.sal-top{display:flex;align-items:center;gap:7px}
.sal-luz{font-size:14px;flex-shrink:0}
.sal-top b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;flex:1;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sal-pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;color:#5C4F3E;flex-shrink:0}
.sal-barra{height:4px;background:#EFE6D5;border-radius:999px;overflow:hidden;margin:6px 0 0}
.sal-barra i{display:block;height:100%}
.sal-faltan{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sal-falta{font-size:10.5px;font-weight:800;background:#FDE7F2;border:1px solid var(--tinta);border-radius:999px;padding:1px 7px}
.sal-ok{font-size:11.5px;font-weight:800;color:#00A878}
.sal-wsp{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#25D366;border:2px solid var(--tinta);display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none}
.plan-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border:2px solid var(--tinta);border-radius:999px;padding:2px 9px;margin-right:6px}
.plan-gratis{background:#EFE6D5}
.plan-plus{background:#E3F2FC}
.plan-pro{background:#FDE7F2}
.plan-perma{background:#DFF5EC}
.plan-vence{background:#FFF0D6}
.btn-cargar{background:var(--verde);color:#fff;border:2px solid var(--tinta);border-radius:10px;padding:7px 13px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 rgba(43,33,24,.9)}
.btn-cargar:active{transform:translate(2px,2px);box-shadow:none}
#velo-carga{position:fixed;inset:0;background:rgba(43,33,24,.6);display:none;align-items:center;justify-content:center;z-index:120;padding:16px}
#velo-carga.on{display:flex}
.mc{background:var(--fondo);border:2px solid var(--tinta);border-radius:16px;box-shadow:5px 5px 0 rgba(43,33,24,.9);padding:18px;max-width:390px;width:100%;max-height:92vh;overflow-y:auto}
.mc h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
.mc .quien{font-size:13px;font-weight:700;color:#5C4F3E;margin-top:3px}
.mc label{display:block;font-size:11.5px;font-weight:800;color:#7A6A55;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.3px}
.mc select,.mc input{width:100%;border:2px solid var(--tinta);border-radius:11px;padding:10px 11px;font-family:'Nunito',sans-serif;font-size:14px;background:var(--blanco)}
.previo{background:#FFFDF4;border:2px dashed #B8860B;border-radius:12px;padding:11px 13px;margin-top:14px;font-size:13px;font-weight:700;line-height:1.6;color:#5C4F3E}
.previo b{color:var(--tinta)}
.previo .res{display:block;margin-top:6px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:#00694D}
.mc-acciones{display:flex;gap:8px;margin-top:15px}
.mc-acciones button{flex:1;border:2px solid var(--tinta);border-radius:12px;padding:11px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.mc-no{background:var(--blanco)}
.mc-si{background:var(--verde);color:#fff}
.carga-row{background:var(--blanco);border:2px solid var(--tinta);border-radius:12px;padding:9px 11px;margin-bottom:7px;box-shadow:2px 2px 0 rgba(43,33,24,.9)}
.carga-row .l1{display:flex;align-items:center;gap:7px}
.carga-row b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;flex:1}
.carga-row .monto{font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;color:#00694D}
.carga-row small{font-size:11.5px;font-weight:700;color:#7A6A55;display:block;margin-top:4px}
.medio-chip{font-size:10.5px;font-weight:800;border:1.5px solid var(--tinta);border-radius:999px;padding:1px 7px}
.m-mercadopago{background:#E3F2FC}
.m-efectivo{background:#DFF5EC}
.m-transferencia{background:#FFF0D6}
.m-cortesia{background:#FDE7F2}
.sal-sanos{background:#DFF5EC;border:2px solid var(--tinta);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:800;color:#00694D;cursor:pointer;margin-bottom:7px}
.sal-sanos small{display:block;font-weight:700;color:#3A6B5B;font-size:11.5px;margin-top:3px;line-height:1.4}
.ref-card{background:#FFFDF4;border:2px dashed #B8860B;border-radius:14px;padding:11px 13px;margin-bottom:10px}
.ref-card b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px}
.ref-card small{font-size:12px;font-weight:700;color:#5C4F3E;display:block;margin-top:3px}
.ref-premio{display:inline-block;font-size:11px;font-weight:800;background:var(--amarillo);border:1.5px solid var(--tinta);border-radius:999px;padding:2px 8px;margin-top:6px}
.sal-sub{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;margin:16px 0 10px}
.tab{flex:1;padding:10px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:#9A8B76;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--fucsia);border-bottom-color:var(--fucsia)}
.lista{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--blanco);border:2px solid var(--tinta);border-radius:var(--radius);overflow:hidden;box-shadow:4px 4px 0 rgba(43,33,24,.9)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.card-emoji{font-size:32px;width:52px;height:52px;background:#FDF1DC;border:2px solid var(--tinta);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.card-emoji.org{background:#E3F2FC;font-size:26px}
.card-titulo{flex:1}
.card-titulo b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;display:block}
.card-titulo small{font-size:12px;font-weight:800;color:var(--fucsia);text-transform:uppercase}
.card-titulo small.celeste{color:var(--celeste)}
.card-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.dato{font-size:13px;font-weight:700;color:#5C4F3E;display:flex;align-items:flex-start;gap:6px;line-height:1.4}
.dato .ic{width:18px;flex-shrink:0;text-align:center}
.redes-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.red-chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--tinta);background:#F0E4CE;display:flex;align-items:center;gap:5px}
.ferias-chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--tinta);background:#DFF5EC;color:#007453}
.rubro-chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--tinta);background:#E3F2FC;color:#1a4f6e}
.card-acciones{display:flex;gap:8px;padding:0 14px 14px}
.btn-aprobar{flex:1;padding:12px;background:var(--verde);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;border:2px solid var(--tinta);border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 rgba(43,33,24,.9);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-aprobar:active{transform:translate(2px,2px);box-shadow:0 0 0}
.btn-aprobar:disabled{background:#DCCFB6;color:#9A8B76;box-shadow:none;cursor:not-allowed;transform:none}
.btn-aprobar.celeste{background:var(--celeste)}
.btn-rechazar{padding:12px 14px;background:var(--blanco);color:var(--tinta);font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;border:2px solid var(--tinta);border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 rgba(43,33,24,.9)}
.btn-rechazar:active{transform:translate(2px,2px);box-shadow:0 0 0}
.card.aprobado{border-color:var(--verde);opacity:.7}
.card.aprobado .card-head{background:#DFF5EC}
.card.aprobado-feria{border-color:var(--celeste);opacity:.7}
.card.aprobado-feria .card-head{background:#E3F2FC}
.tag-aprobado{font-size:11px;font-weight:800;background:var(--verde);color:#fff;border-radius:999px;padding:2px 10px}
.tag-aprobado.celeste{background:var(--celeste)}
.vacio{text-align:center;padding:40px 20px;color:#9A8B76;font-weight:700;font-size:15px}
.vacio span{font-size:40px;display:block;margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#FFF8EC;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;padding:12px 22px;border-radius:12px;box-shadow:4px 4px 0 rgba(43,33,24,.5);opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="banderines" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
</div>
<header>
  <div class="logo">La <em style="font-style:normal">Digi</em> <span>Feria</span></div>
  <span class="badge-admin">🔑 Panel Admin</span>
  <button id="btn-salir" onclick="salirAdmin()" style="display:none;margin-left:8px;background:none;border:2px solid var(--tinta);border-radius:999px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:4px 10px;cursor:pointer">Salir</button>
</header>

<div class="login" id="login">
  <div style="font-size:48px">🔐</div>
  <h2>Acceso al panel</h2>
  <p style="font-size:13px;color:#7A6A55;font-weight:700;text-align:center;margin-top:-6px">
    Entrá con tu cuenta de La Digi Feria.</p>
  <input type="email" id="adm-email" placeholder="Tu email" autocomplete="username"
         onkeydown="if(event.key==='Enter')document.getElementById('pwd').focus()">
  <input type="password" id="pwd" placeholder="Tu contraseña" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn" id="btn-entrar" onclick="entrar()">Entrar</button>
  <span class="error" id="login-error" style="display:none"></span>
</div>

<div class="panel" id="panel">
  <div class="panel-header">
    <h2 id="panel-titulo">Solicitudes</h2>
    <span class="contador" id="contador">0 pendientes</span>
  </div>
  <div class="tabs-main">
    <button class="tab-main on" onclick="cambiarSeccion('feriantes',this)">🛍️ Feriantes</button>
    <button class="tab-main" onclick="cambiarSeccion('ferias',this)">📣 Ferias</button>
    <button class="tab-main" onclick="cambiarSeccion('interesados',this)">🌱 Interesados</button>
    <button class="tab-main" onclick="cambiarSeccion('salud',this)">💚 Salud</button>
    <button class="tab-main" onclick="cambiarSeccion('cargas',this)">💳 Cargas</button>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="cambiarTab('pendientes',this)">⏳ Pendientes</div>
    <div class="tab" onclick="cambiarTab('aprobados',this)">✅ Aprobados</div>
  </div>
  <div class="lista" id="lista"></div>
</div>

<div class="toast" id="toast"></div>
</div>

<script>
const SUPABASE_URL = "https://msbtiihlcgiycorskkdt.supabase.co";
const SUPABASE_KEY = "sb_publishable_eM5s_vC0_StPCC7sWlYFmQ_gEzvi46A";
const cab = { "Content-Type":"application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
// La contraseña ya NO vive acá: se valida contra Supabase y la base
// verifica que el usuario esté en la tabla de administradores.
let tokenAdmin = null;
function cabAuth(){
  return { "Content-Type":"application/json", apikey: SUPABASE_KEY,
           Authorization: `Bearer ${tokenAdmin || SUPABASE_KEY}` };
}

let tabActual = "pendientes";
let seccionActual = "feriantes";
let puestos = [];
let ferias  = [];

async function entrar(){
  const email = document.getElementById('adm-email').value.trim();
  const pass  = document.getElementById('pwd').value;
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('btn-entrar');

  if(!email || !pass){
    err.textContent = 'Completá tu email y tu contraseña'; err.style.display='block'; return;
  }
  err.style.display = 'none';
  btn.textContent = 'Entrando…'; btn.disabled = true;

  try{
    // 1. Iniciar sesión de verdad
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if(!r.ok || !d.access_token) throw new Error('Email o contraseña incorrectos');
    tokenAdmin = d.access_token;

    // 2. Preguntarle a la base si este usuario es administrador
    const ra = await fetch(`${SUPABASE_URL}/rest/v1/rpc/es_admin`, {
      method:'POST', headers: cabAuth(), body: '{}'
    });
    const esAdmin = await ra.json();
    if(esAdmin !== true){
      tokenAdmin = null;
      throw new Error('Esta cuenta no tiene permiso de administrador');
    }

    sessionStorage.setItem('digi_admin_token', tokenAdmin);
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').classList.add('on');
    document.getElementById('btn-salir').style.display = '';
    cargarTodo();
  }catch(e){
    err.textContent = e.message; err.style.display = 'block';
  }finally{
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}

function salirAdmin(){
  tokenAdmin = null;
  sessionStorage.removeItem('digi_admin_token');
  location.reload();
}

// Escapa el texto para que no rompa el HTML
function esc(t){
  return String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let interesados = [];
let salud = [];
let referidos = [];

async function cargarSalud(){
  try{
    const [rs, rr] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/rpc/salud_feria`,     {method:'POST', headers:cabAuth(), body:'{}'}),
      fetch(`${SUPABASE_URL}/rest/v1/rpc/referidos_admin`, {method:'POST', headers:cabAuth(), body:'{}'})
    ]);
    salud     = rs.ok ? await rs.json() : [];
    referidos = rr.ok ? await rr.json() : [];
  }catch(e){ salud = []; referidos = []; }
}

async function cargarTodo(){
  await Promise.all([cargarPuestos(), cargarFerias(), cargarInteresados()]);
  renderLista();
}

async function cargarInteresados(){
  try{
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/interesados?select=*&order=creado_en.desc`,
      { headers: cabAuth() });
    interesados = r.ok ? await r.json() : [];
  }catch(e){ interesados = []; }
  if(seccionActual === 'interesados') renderLista();
}

// Marcar a alguien como ya contactado
async function marcarContactado(id, valor){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/interesados?id=eq.${id}`, {
      method:'PATCH',
      headers:{ ...cabAuth(), Prefer:'return=minimal' },
      body: JSON.stringify({ contactado: valor })
    });
    if(!r.ok) throw new Error('No se pudo guardar');
    const it = interesados.find(x=>x.id===id);
    if(it) it.contactado = valor;
    renderLista();
    toast(valor ? '✅ Marcado como contactado' : '↩️ Marcado como pendiente');
  }catch(e){ toast('❌ ' + e.message); }
}

async function cargarPuestos(){
  const resp = await fetch(
    `${SUPABASE_URL}/rest/v1/puestos?select=${encodeURIComponent("id,nombre,bio,foto_url,whatsapp,plan,plan_hasta,plan_permanente,publicado,redes,creado_en,email_contacto,nombre_persona,rubros(nombre,emoji),puesto_feria(ferias(nombre))")}&order=creado_en.desc`,
    {headers:cabAuth()}
  );
  puestos = resp.ok ? await resp.json() : [];
}

async function cargarFerias(){
  const resp = await fetch(
    `${SUPABASE_URL}/rest/v1/ferias?select=id,nombre,lugar,frecuencia,estado,descripcion,rubros_principales,cantidad_puestos,precio_entrada,email_contacto,nombre_contacto,whatsapp_contacto,whatsapp_publico,redes&estado=neq.rechazada&order=nombre.asc`,
    {headers:cabAuth()}
  );
  ferias = resp.ok ? await resp.json() : [];
}

function cambiarSeccion(sec, el){
  seccionActual = sec;
  document.querySelectorAll('.tab-main').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  tabActual = 'pendientes';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on', i===0));
  // Interesados no se divide en pendientes/aprobados
  const filaTabs = document.querySelector('.tabs');
  if(filaTabs) filaTabs.style.display = (sec === 'interesados' || sec === 'salud' || sec === 'cargas') ? 'none' : '';
  if(sec === 'interesados' && !interesados.length) cargarInteresados();
  else if(sec === 'cargas'){
    document.getElementById('lista').innerHTML =
      '<div style="text-align:center;padding:30px;color:#7A6A55;font-weight:700">Buscando las cargas…</div>';
    cargarHistorial().then(renderLista);
  }
  else if(sec === 'salud'){
    document.getElementById('lista').innerHTML =
      '<div style="text-align:center;padding:30px;color:#7A6A55;font-weight:700">Mirando cómo anda la feria…</div>';
    cargarSalud().then(renderLista);
  }
  else renderLista();
}

function cambiarTab(tab, el){

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');

}

const SEMAFORO = {
  sano:         {luz:'🟢', texto:'Todo en orden',        color:'#00A878'},
  flojo:        {luz:'🟡', texto:'Le falta cargar cosas', color:'#FFC93C'},
  dormido:      {luz:'🟠', texto:'Sin actividad',         color:'#FF7A00'},
  critico:      {luz:'🔴', texto:'Necesita ayuda ya',     color:'#E91E8C'},
  sin_publicar: {luz:'⚪', texto:'Todavía sin publicar',  color:'#9A8B76'}
};

function faltantesDe(p){
  const f = [];
  if(!p.tiene_logo)              f.push('sin logo');
  if(!p.tiene_bio)               f.push('sin descripción');
  if(!p.tiene_whatsapp)          f.push('sin WhatsApp');
  if(!p.productos)               f.push('sin productos');
  else if(p.productos < 3)       f.push(`solo ${p.productos} producto${p.productos>1?'s':''}`);
  if(p.productos && !p.productos_con_foto) f.push('productos sin foto');
  if(!p.ferias_vinculadas)       f.push('sin feria vinculada');
  if(p.dias_sin_confirmar === null && p.ferias_vinculadas)
                                 f.push('nunca confirmó asistencia');
  else if(p.dias_sin_confirmar > 30)
                                 f.push(`${p.dias_sin_confirmar} días sin confirmar`);
  return f;
}

function renderSalud(cont){
  document.getElementById('panel-titulo').textContent = 'Salud de la feria';
  const atencion = salud.filter(p=>p.estado !== 'sano').length;
  document.getElementById('contador').textContent =
    atencion ? `${atencion} necesitan atención` : 'Todo en orden';

  if(!salud.length){
    cont.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#7A6A55;font-weight:700">
      <div style="font-size:40px">💚</div>
      <p style="margin-top:10px">Todavía no hay puestos para revisar.</p></div>`;
    return;
  }

  const cuenta = e => salud.filter(p=>p.estado===e).length;
  const prom = Math.round(salud.reduce((a,p)=>a+(p.completitud||0),0)/salud.length);

  let html = `<div class="sal-resumen">
    <div class="sal-chip"><b>${salud.length}</b><small>PUESTOS</small></div>
    <div class="sal-chip"><b>${prom}%</b><small>COMPLETOS</small></div>
    <div class="sal-chip"><b>⚪ ${cuenta('sin_publicar')}</b><small>SIN PUBLICAR</small></div>
    <div class="sal-chip"><b>🟡 ${cuenta('flojo')}</b><small>FLOJOS</small></div>
    <div class="sal-chip"><b>🟠 ${cuenta('dormido')}</b><small>DORMIDOS</small></div>
    <div class="sal-chip"><b>🔴 ${cuenta('critico')}</b><small>CRÍTICOS</small></div>
  </div>`;

  // Los que están bien no ocupan lugar: van resumidos en una línea
  const sanos = salud.filter(p=>p.estado === 'sano');
  const revisar = salud.filter(p=>p.estado !== 'sano');

  if(sanos.length){
    html += `<div class="sal-sanos" onclick="this.querySelector('small').style.display=
      this.querySelector('small').style.display==='none'?'block':'none'">
      🟢 ${sanos.length} puesto${sanos.length>1?'s':''} en orden — no necesitan nada
      <small style="display:none">${sanos.map(p=>esc(p.nombre)).join(' · ')}</small>
    </div>`;
  }

  html += revisar.map(p=>{
    const sem = SEMAFORO[p.estado] || SEMAFORO.flojo;
    const falta = faltantesDe(p);
    const wsp = String(p.whatsapp||'').replace(/[^0-9]/g,'');
    const msg = encodeURIComponent(
      `Hola! 👋 Soy Javier de La Digi Feria. Estuve mirando tu puesto ${p.nombre} y quería darte una mano para dejarlo redondo. ¿Tenés un rato?`);
    return `<div class="sal-card">
      <div class="sal-top">
        <span class="sal-luz">${sem.luz}</span>
        <b>${esc(p.nombre)}</b>
        <span class="sal-pct">${p.completitud}%</span>
        ${wsp ? `<a class="sal-wsp" href="https://wa.me/${wsp}?text=${msg}" target="_blank" rel="noopener" title="Escribirle por WhatsApp">💬</a>` : ''}
      </div>
      ${falta.length
        ? `<div class="sal-faltan">${falta.map(f=>`<span class="sal-falta">${f}</span>`).join('')}</div>`
        : `<div class="sal-ok" style="margin-top:5px">✓ No le falta nada</div>`}
      <div class="sal-barra"><i style="width:${p.completitud}%;background:${sem.color}"></i></div>
    </div>`;
  }).join('');

  html += `<div class="sal-sub">🤝 Referidos</div>`;
  html += referidos.length
    ? referidos.map(r=>`<div class="ref-card">
        <b>${esc(r.padrino)}</b>
        <small>${r.invitados} invitado${r.invitados!==1?'s':''} · ${r.invitados_publicados} ya publicado${r.invitados_publicados!==1?'s':''}</small>
        ${r.premios_ganados ? `<span class="ref-premio">🎁 ${r.premios_ganados} premio${r.premios_ganados>1?'s':''} para dar</span>` : ''}
      </div>`).join('')
    : `<div style="color:#7A6A55;font-weight:700;font-size:13px;padding:4px 2px">
         Todavía nadie sumó a otro feriante con su link.</div>`;

  cont.innerHTML = html;
}

// ================== CARGAS DE DÍAS ==================
let PRECIOS = [];
let cargas = [];
let cargaDestino = null;   // {tipo, id, nombre}

async function cargarPrecios(){
  if(PRECIOS.length) return;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/precios?select=concepto,meses,dias,precio&activo=eq.true&order=concepto,meses`,
    {headers: cabAuth()});
  PRECIOS = r.ok ? await r.json() : [];
}

const NOMBRE_CONCEPTO = {plus:'Plan Plus', pro:'Plan Pro', feria_destacada:'Feria Destacada'};

async function abrirCarga(tipo, id, nombre){
  await cargarPrecios();
  cargaDestino = {tipo, id, nombre};
  document.getElementById('carga-quien').textContent = nombre;

  const conceptos = tipo === 'puesto' ? ['plus','pro'] : ['feria_destacada'];
  document.getElementById('carga-concepto').innerHTML =
    conceptos.map(c=>`<option value="${c}">${NOMBRE_CONCEPTO[c]}</option>`).join('');
  if(tipo === 'puesto') document.getElementById('carga-concepto').value = 'pro';

  pintarMeses();
  document.getElementById('carga-nota').value = '';
  document.getElementById('velo-carga').classList.add('on');
  previoCarga();
}

function pintarMeses(){
  const c = document.getElementById('carga-concepto').value;
  const packs = PRECIOS.filter(x=>x.concepto === c);
  document.getElementById('carga-meses').innerHTML = packs.map(x=>
    `<option value="${x.meses}">${x.meses} mes${x.meses>1?'es':''} — $${Number(x.precio).toLocaleString('es-AR')}</option>`
  ).join('');
}

document.addEventListener('change', e=>{
  if(e.target.id === 'carga-concepto'){ pintarMeses(); }
});

function cerrarCarga(){
  document.getElementById('velo-carga').classList.remove('on');
  cargaDestino = null;
}

async function previoCarga(){
  if(!cargaDestino) return;
  const caja = document.getElementById('carga-previo');
  const concepto = document.getElementById('carga-concepto').value;
  const meses = parseInt(document.getElementById('carga-meses').value, 10);
  const medio = document.getElementById('carga-medio').value;
  if(!concepto || !meses) return;

  caja.textContent = 'Calculando…';
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/simular_carga`, {
      method:'POST', headers: cabAuth(),
      body: JSON.stringify({
        p_puesto_id: cargaDestino.tipo === 'puesto' ? cargaDestino.id : null,
        p_feria_id:  cargaDestino.tipo === 'feria'  ? cargaDestino.id : null,
        p_concepto: concepto, p_meses: meses })
    });
    if(!r.ok) throw new Error(await r.text());
    const [s] = await r.json();
    if(!s){ caja.textContent = 'No se pudo calcular.'; return; }

    const fecha = d => d ? new Date(d+'T12:00:00').toLocaleDateString('es-AR') : '—';
    const plata = medio === 'cortesia'
      ? ' <span class="medio-chip m-cortesia">sin cargo</span>'
      : ` · $${Number(s.precio).toLocaleString('es-AR')}`;

    let html = '';
    const P = c => NOMBRE_CONCEPTO[c] || (c||'').toUpperCase();

    if(s.caso === 'arranca'){
      html = `Hoy: <b>GRATIS</b>`;
      if(s.vence_actual) html += ` (venció el ${fecha(s.vence_actual)})`;
      html += `<br>Arranca hoy con <b>${s.dias_comprados} días</b>${plata}`;
    }else if(s.caso === 'suma'){
      html = `Hoy: <b>${P(s.plan_actual)}</b> hasta el ${fecha(s.vence_actual)}`;
      html += `<br>Mismo plan que el último tramo: se le suman <b>${s.dias_comprados} días</b>${plata}`;
    }else{
      html = `Hoy: <b>${P(s.plan_actual)}</b> hasta el ${fecha(s.vence_actual)}`;
      html += `<br>Va al final de la fila: <b>${s.dias_comprados} días</b> de ${P(concepto)}${plata}`;
      html += `<br>🔒 No se toca ni se pierde nada de lo que ya tiene.`;
    }

    if(s.fila && s.fila.length){
      html += `<div style="margin-top:9px;border-top:1px dashed rgba(43,33,24,.3);padding-top:8px">`;
      html += `<b style="font-size:12px">Cómo queda la fila</b>`;
      s.fila.forEach(t=>{
        const nuevo = t.estado === 'nuevo';
        const corre = t.estado === 'corriendo';
        html += `<div style="display:flex;gap:7px;align-items:baseline;margin-top:5px;${nuevo?'color:#00694D;font-weight:800':''}">
          <span>${corre ? '▶️' : nuevo ? '🆕' : '⏭️'}</span>
          <span style="flex:1">${P(t.plan)} · ${t.dias} días</span>
          <span style="font-size:11.5px">${fecha(t.desde)} → ${fecha(t.hasta)}</span>
        </div>`;
      });
      html += `</div>`;
    }else{
      html += `<span class="res">→ ${P(concepto)} del ${fecha(s.arranca_el)} al ${fecha(s.termina_el)}</span>`;
    }
    caja.innerHTML = html;
  }catch(e){
    caja.textContent = 'No se pudo calcular: ' + String(e).slice(0,120);
  }
}

async function confirmarCarga(){
  if(!cargaDestino) return;
  const btn = document.getElementById('carga-confirmar');
  btn.disabled = true; btn.textContent = 'Cargando…';
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/cargar_dias`, {
      method:'POST', headers: cabAuth(),
      body: JSON.stringify({
        p_puesto_id: cargaDestino.tipo === 'puesto' ? cargaDestino.id : null,
        p_feria_id:  cargaDestino.tipo === 'feria'  ? cargaDestino.id : null,
        p_concepto: document.getElementById('carga-concepto').value,
        p_meses: parseInt(document.getElementById('carga-meses').value,10),
        p_medio: document.getElementById('carga-medio').value,
        p_nota: document.getElementById('carga-nota').value.trim() || null })
    });
    if(!r.ok) throw new Error(await r.text());
    const [res] = await r.json();
    cerrarCarga();
    alert(`✅ Listo: ${res.plan.toUpperCase()} hasta el ` +
          new Date(res.vence+'T12:00:00').toLocaleDateString('es-AR'));
    cargas = [];
    await cargarPuestos();
    renderLista();
  }catch(e){
    alert('No se pudo cargar: ' + String(e).slice(0,200));
  }finally{
    btn.disabled = false; btn.textContent = 'Cargar';
  }
}

async function cargarHistorial(){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/cargas_admin`,
      {method:'POST', headers: cabAuth(), body:'{}'});
    cargas = r.ok ? await r.json() : [];

}

function renderCargas(cont){
  document.getElementById('panel-titulo').textContent = 'Cargas';
  const mes = cargas.filter(c=>{
    const d = new Date(c.creado_en);
    const h = new Date();
    return d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
  });
  const total = mes.reduce((a,c)=>a + Number(c.precio||0), 0);
  document.getElementById('contador').textContent =
    `${mes.length} este mes · $${total.toLocaleString('es-AR')}`;

  if(!cargas.length){
    cont.innerHTML = `<div class="vacio"><span>💳</span>Todavía no hay cargas registradas.</div>`;
    return;
  }
  cont.innerHTML = cargas.map(c=>{
    const f = new Date(c.creado_en).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const vence = c.plan_hasta || c.destacada_hasta;
    return `<div class="carga-row">
      <div class="l1">
        <b>${c.destino || '—'}</b>
        <span class="monto">${Number(c.precio) > 0 ? '$'+Number(c.precio).toLocaleString('es-AR') : 'sin cargo'}</span>
      </div>
      <small>
        ${NOMBRE_CONCEPTO[c.concepto] || c.concepto} · ${c.meses} mes${c.meses>1?'es':''} ·
        <span class="medio-chip m-${c.medio}">${c.medio}</span> · ${f}
        ${vence ? ' · vence ' + new Date(vence+'T12:00:00').toLocaleDateString('es-AR') : ''}
        ${c.nota ? '<br>📝 ' + c.nota : ''}
      </small>
    </div>`;
  }).join('');
}

function cardPuesto(p){
  const rubro = p.rubros ? `${p.rubros.emoji} ${p.rubros.nombre}` : '—';
  const ferias_vinc = (p.puesto_feria||[]).map(pf=>pf.ferias?.nombre).filter(Boolean);
  const redes = p.redes || {};
  const wsp = p.whatsapp || '';
  const wspPersonal = redes.whatsapp_personal || '';
  const fecha = p.creado_en ? new Date(p.creado_en).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
  const redesHtml = Object.entries(redes).filter(([k])=>k!=='whatsapp_personal').map(([k,v])=>{
    const iconos = {instagram:'<i class="fa-brands fa-instagram"></i>',tiktok:'<i class="fa-brands fa-tiktok"></i>',facebook:'<i class="fa-brands fa-facebook-f"></i>',web:'<i class="fa-solid fa-globe"></i>'};
    return `<span class="red-chip">${iconos[k]||'🔗'} ${v}</span>`;
  }).join("");
  const feriasHtml = ferias_vinc.map(f=>`<span class="ferias-chip">📍 ${f}</span>`).join("");
  const email = p.email_contacto || '';
  const nombrePersona = p.nombre_persona || '';
  const plan = p.plan || 'gratis';
  const permanente = p.plan_permanente === true;
  const diasRest = p.plan_hasta ? Math.ceil((new Date(p.plan_hasta+'T12:00:00') - new Date())/86400000) : null;
  const planChip = permanente
    ? `<span class="plan-chip plan-perma">⭐ ${plan.toUpperCase()} · no vence</span>`
    : plan === 'gratis'
      ? `<span class="plan-chip plan-gratis">🎪 Gratis</span>`
      : `<span class="plan-chip plan-${plan}">${plan === 'pro' ? '⭐' : '✅'} ${plan.toUpperCase()}</span>` +
        (diasRest !== null ? `<span class="plan-chip plan-vence">⏳ ${diasRest} día${diasRest!==1?'s':''}</span>` : '') +
        '';

  const acciones = p.publicado
    ? `<div class="card-acciones" style="flex-wrap:wrap;gap:7px;align-items:center">
         <span class="tag-aprobado">✅ Publicado</span>
         ${planChip}
         ${permanente ? '' : `<button class="btn-cargar" onclick="abrirCarga('puesto','${p.id}','${(p.nombre||'').replace(/'/g,"\\'")}')">💳 Cargar días</button>`}
       </div>`
    : `<div class="card-acciones">
        <button class="btn-aprobar" id="btn-${p.id}" onclick="aprobar('${p.id}','${p.nombre}','${wsp}','${email}','${nombrePersona}')">
          <i class="fa-solid fa-check"></i> Aprobar y publicar
        </button>
        <button class="btn-rechazar" onclick="rechazarPuesto('${p.id}')">✕</button>
       </div>`;
  return `<div class="card ${p.publicado?'aprobado':''}" id="card-${p.id}">
    <div class="card-head">
      <div class="card-emoji"${(p.foto_url||'').startsWith('http')
          ? ` style="background-image:url('${p.foto_url}')"></div>`
          : `>${p.foto_url||'🎪'}</div>`}
      <div class="card-titulo"><b>${p.nombre}</b><small>${rubro}</small></div>
    </div>
    <div class="card-body">
      <div class="dato"><span class="ic">📝</span>${p.bio||'—'}</div>
      ${wsp?`<div class="dato"><span class="ic">💬</span><a href="https://wa.me/${wsp}" target="_blank" style="color:var(--verde);font-weight:800">${wsp}</a></div>`:''}
      ${wspPersonal?`<div class="dato"><span class="ic">📞</span>Personal: <a href="https://wa.me/${wspPersonal}" target="_blank" style="color:var(--verde);font-weight:800">${wspPersonal}</a></div>`:''}
      ${redesHtml?`<div class="dato"><span class="ic">🔗</span><div class="redes-row">${redesHtml}</div></div>`:''}
      ${feriasHtml?`<div class="dato"><span class="ic">📅</span><div class="redes-row">${feriasHtml}</div></div>`:''}
      ${email?`<div class="dato"><span class="ic">📧</span>${email}</div>`:''}
      ${nombrePersona?`<div class="dato"><span class="ic">👤</span>${nombrePersona}</div>`:''}
      <div class="dato"><span class="ic">🕐</span>Solicitado: ${fecha}</div>
    </div>
    ${acciones}
  </div>`;
}

function cardFeria(f){
  const aprobada = f.estado !== 'pendiente';
  const rubros = (f.rubros_principales||[]).map(r=>`<span class="rubro-chip">🛍️ ${r}</span>`).join("");
  const redes = f.redes || {};
  const redesHtml = Object.entries(redes).map(([k,v])=>{
    const iconos = {instagram:'<i class="fa-brands fa-instagram"></i>',facebook:'<i class="fa-brands fa-facebook-f"></i>',tiktok:'<i class="fa-brands fa-tiktok"></i>',web:'<i class="fa-solid fa-globe"></i>'};
    return `<span class="red-chip">${iconos[k]||'🔗'} ${v}</span>`;
  }).join("");
  const wsp = f.whatsapp_contacto || '';
  const email = f.email_contacto || '';
  const nombre = f.nombre_contacto || '';
  const acciones = aprobada
    ? `<div class="card-acciones"><span class="tag-aprobado celeste">✅ Activa</span></div>`
    : `<div class="card-acciones">
        <button class="btn-aprobar celeste" id="btn-f-${f.id}" onclick="aprobarFeria('${f.id}','${f.nombre}','${wsp}','${email}','${nombre}')">
          <i class="fa-solid fa-check"></i> Aprobar feria
        </button>
        <button class="btn-rechazar" onclick="rechazarFeria('${f.id}','${f.nombre}')">✕</button>
       </div>`;
  return `<div class="card ${aprobada?'aprobado-feria':''}" id="card-f-${f.id}">
    <div class="card-head">
      <div class="card-emoji org">📣</div>
      <div class="card-titulo"><b>${f.nombre}</b><small class="celeste">Organizador de feria</small></div>
    </div>
    <div class="card-body">
      ${f.descripcion?`<div class="dato"><span class="ic">📝</span>${f.descripcion}</div>`:''}
      ${f.lugar?`<div class="dato"><span class="ic">📍</span>${f.lugar}</div>`:''}
      ${f.frecuencia?`<div class="dato"><span class="ic">🔁</span>${f.frecuencia}</div>`:''}
      ${f.cantidad_puestos?`<div class="dato"><span class="ic">🎪</span>${f.cantidad_puestos}</div>`:''}
      ${f.precio_entrada!=null?`<div class="dato"><span class="ic">🎟️</span>Entrada: ${Number(f.precio_entrada)===0?'Gratis':'$'+Number(f.precio_entrada).toLocaleString('es-AR')}</div>`:''}
      ${rubros?`<div class="dato"><span class="ic">🛍️</span><div class="redes-row">${rubros}</div></div>`:''}
      ${redesHtml?`<div class="dato"><span class="ic">🔗</span><div class="redes-row">${redesHtml}</div></div>`:''}
      ${nombre?`<div class="dato"><span class="ic">👤</span>${nombre}</div>`:''}
      ${email?`<div class="dato"><span class="ic">📧</span>${email}</div>`:''}
      ${wsp?`<div class="dato"><span class="ic">💬</span><a href="https://wa.me/${wsp}" target="_blank" style="color:var(--verde);font-weight:800">${wsp}</a></div>`:''}
    </div>
    ${acciones}
  </div>`;
}

// ── APROBAR FERIANTE — con creación de cuenta ──
async function aprobar(id, nombre, wsp, email, nombrePersona){
  const btn = document.getElementById('btn-'+id);
  btn.disabled = true;
  btn.innerHTML = '⏳ Publicando...';

  try{
    // 1. Publicar el puesto
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/puestos?id=eq.${id}`, {
      method:'PATCH',
      headers:{...cab, Prefer:'return=minimal'},
      body: JSON.stringify({publicado: true})
    });
    if(!resp.ok) throw new Error('No se pudo publicar el puesto');

    // 2. Crear cuenta del feriante via Edge Function
    let cuentaCreada = false;
    if(email){
      btn.innerHTML = '⏳ Creando cuenta...';
      try{
        const respInvite = await fetch(`${SUPABASE_URL}/functions/v1/invitar-feriante`, {
          method:'POST',
          headers:{...cab},
          body: JSON.stringify({
            email,
            nombre_puesto: nombre,
            nombre_persona: nombrePersona || nombre,
            puesto_id: id
          })
        });
        const inviteData = await respInvite.json();
        cuentaCreada = inviteData.ok;
        if(!inviteData.ok) console.warn('Invite warning:', inviteData.error);
      }catch(e){ console.warn('Edge Function error:', e); }
    }

    // 3. Actualizar lista
    const p = puestos.find(x=>x.id===id);
    if(p) p.publicado = true;
    renderLista();

    // 4. Email de bienvenida (Resend) — además del email de cuenta
    try{
      if(email){
        await fetch(`${SUPABASE_URL}/functions/v1/enviar-bienvenida`, {
          method:'POST', headers:{...cab},
          body: JSON.stringify({ email, nombre_puesto: nombre, nombre_persona: nombrePersona||nombre })
        });
      }
    }catch(e){ console.warn("Email bienvenida no enviado:", e); }

    toast(`✅ ${nombre} publicado${cuentaCreada?' y cuenta creada 📧':''}`);

    // 5. WhatsApp avisando
    if(wsp){
      const msg = cuentaCreada
        ? encodeURIComponent(`¡Hola${nombrePersona?' '+nombrePersona:''}! 🎪 Tu puesto *${nombre}* ya está publicado en *La Digi Feria*.\n\nTe mandamos un email a *${email}* con el link para crear tu contraseña y acceder a tu panel. ¡Revisá tu bandeja de entrada! 🌱`)
        : encodeURIComponent(`¡Hola! 🎪 Te damos la bienvenida a *La Digi Feria*. Tu puesto *${nombre}* ya está publicado. ¡Mucho éxito!`);
      window.open(`https://wa.me/${wsp}?text=${msg}`, '_blank');
    }

  }catch(e){
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Aprobar y publicar';
    toast('❌ Error: ' + (e.message || 'intentá de nuevo'));
  }
}

async function rechazarPuesto(id){
  if(!confirm('¿Rechazar y eliminar este puesto?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/puestos?id=eq.${id}`, {method:'DELETE', headers:cabAuth()});
  puestos = puestos.filter(p=>p.id!==id);
  renderLista();
  toast('🗑️ Puesto eliminado');
}

// ── APROBAR FERIA — con creación de cuenta ──
async function aprobarFeria(id, nombre, wsp, email, nombreContacto){
  const btn = document.getElementById('btn-f-'+id);
  btn.disabled = true;
  btn.innerHTML = '⏳ Aprobando...';

  try{
    // 1. Cambiar estado a 'activa'
    const respFeria = await fetch(`${SUPABASE_URL}/rest/v1/ferias?id=eq.${id}`, {
      method:'PATCH',
      headers:{...cab, Prefer:'return=minimal'},
      body: JSON.stringify({estado: 'activa'})
    });
    if(!respFeria.ok) throw new Error('No se pudo aprobar la feria');

    // 2. Crear cuenta del organizador + perfil via Edge Function
    let userId = null;
    if(email){
      btn.innerHTML = '⏳ Creando cuenta...';
      const respInvite = await fetch(`${SUPABASE_URL}/functions/v1/invitar-organizador`, {
        method:'POST',
        headers:{...cab},
        body: JSON.stringify({
          email,
          nombre_feria: nombre,
          nombre_contacto: nombreContacto,
          feria_id: id
        })
      });
      const inviteData = await respInvite.json();
      if(inviteData.ok){
        userId = inviteData.user_id;
      } else {
        // Si el usuario ya existe, igual seguimos (puede ser que ya tenga cuenta)
        console.warn('Invite warning:', inviteData.error);
      }
    }

    // 3. Vincular usuario con la feria en organizador_feria
    if(userId){
      await fetch(`${SUPABASE_URL}/rest/v1/organizador_feria`, {
        method:'POST',
        headers:{...cab, Prefer:'resolution=merge-duplicates'},
        body: JSON.stringify({ usuario_id: userId, feria_id: id })
      });
    }

    // 4. Actualizar lista
    const f = ferias.find(x=>x.id===id);
    if(f) f.estado = 'activa';
    renderLista();
    toast(`✅ ${nombre} aprobada — email de acceso enviado a ${email||'organizador'}`);

    // 5. WhatsApp avisando que revise el email
    if(wsp){
      const msg = encodeURIComponent(
        `¡Hola${nombreContacto?' '+nombreContacto:''}! 📣 Tu feria *${nombre}* ya está activa en *La Digi Feria*.\n\nTe mandamos un email a *${email}* con el link para crear tu contraseña y acceder a tu panel de organizador.\n\n¡Revisá tu bandeja de entrada! 🎉`
      );
      window.open(`https://wa.me/${wsp}?text=${msg}`, '_blank');
    }

  } catch(e){
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Aprobar feria';
    toast('❌ Error: ' + (e.message || 'intentá de nuevo'));
  }
}

async function rechazarFeria(id, nombre){
  if(!confirm(`¿Rechazar la solicitud de "${nombre}"? No va a aparecer más en pendientes.`)) return;
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/ferias?id=eq.${id}`, {
    method:'PATCH',
    headers:{...cab, Prefer:'return=minimal'},
    body: JSON.stringify({estado: 'rechazada'})
  });
  if(resp.ok){
    ferias = ferias.filter(f=>f.id!==id);
    renderLista();
    toast('🗑️ Solicitud rechazada');
  } else {
    toast('❌ No se pudo rechazar. Revisá los permisos en Supabase.');
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 3500);
}
