<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar mi email — La Digi Feria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fucsia:#E91E8C; --naranja:#FF7A00; --amarillo:#FFC93C;
  --verde:#00A878; --celeste:#2D9CDB; --tinta:#2B2118;
  --fondo:#FFF8EC; --blanco:#FFFFFF; --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#EFE6D5;color:var(--tinta);padding:0 0 40px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--fondo);box-shadow:0 0 40px rgba(43,33,24,.15)}
.banderines{display:flex;height:22px;overflow:hidden}
.banderines span{flex:1;min-width:26px;clip-path:polygon(0 0,100% 0,50% 100%)}
.banderines span:nth-child(5n+1){background:var(--fucsia)}
.banderines span:nth-child(5n+2){background:var(--amarillo)}
.banderines span:nth-child(5n+3){background:var(--verde)}
.banderines span:nth-child(5n+4){background:var(--naranja)}
.banderines span:nth-child(5n+5){background:var(--celeste)}
header{background:var(--blanco);border-bottom:1px solid #F0E4CE;padding:14px 18px 12px;text-align:center}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px}
.logo em{font-style:normal;color:var(--fucsia)}
.logo .fer{color:var(--naranja)}
.seccion{padding:26px 18px}
.tarjeta{background:var(--blanco);border:2px solid var(--tinta);border-radius:var(--radius);
  box-shadow:5px 5px 0 rgba(43,33,24,.9);padding:26px 20px;text-align:center}
.tarjeta.festejo{background:linear-gradient(135deg,#DFF5EC,#FFF0D6)}
.emoji{font-size:46px;line-height:1}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin-top:10px}
.sub{color:#5C4F3E;font-size:14.5px;margin-top:10px;line-height:1.55;font-weight:600}
.mail{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;
  background:var(--fondo);border:2px solid var(--tinta);border-radius:999px;padding:6px 15px;margin-top:14px}
.btn{display:block;width:100%;margin-top:18px;padding:14px;background:var(--fucsia);color:#fff;
  border:2px solid var(--tinta);border-radius:14px;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:15.5px;text-align:center;text-decoration:none;box-shadow:4px 4px 0 rgba(43,33,24,.9);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,33,24,.9)}
.btn-suave{background:var(--blanco);color:var(--tinta);margin-top:10px}
.chico{font-size:12.5px;color:#7A6A55;font-weight:700;margin-top:16px;line-height:1.5}
.cargando{text-align:center;color:#9A8B76;font-weight:700;padding:40px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">La <em>Digi</em> <span class="fer">Feria</span></div>
  </header>
  <div class="banderines" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="seccion">
    <div id="contenido"><div class="cargando">Confirmando tu email…</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://msbtiihlcgiycorskkdt.supabase.co";
const SUPABASE_KEY = "sb_publishable_eM5s_vC0_StPCC7sWlYFmQ_gEzvi46A";

const cab = {
  "Content-Type": "application/json",
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`
};

const token = new URLSearchParams(location.search).get('t');
const esc = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pintar(html){ document.getElementById('contenido').innerHTML = html; }

function errorLink(titulo, texto){
  pintar(`
    <div class="tarjeta">
      <div class="emoji">🤔</div>
      <h1>${titulo}</h1>
      <p class="sub">${texto}</p>
      <a class="btn" href="https://digiferia.ar">🎪 Ir a La Digi Feria</a>
    </div>`);
}

async function confirmar(){
  if(!token){
    errorLink('Nos falta el código del link',
      'Abrí el enlace tal como viene en el email, sin recortarlo.');
    return;
  }

  let res;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/confirmar_suscripcion`, {
      method: 'POST', headers: cab, body: JSON.stringify({ p_token: token })
    });
    if(!r.ok) throw new Error('fallo');
    const filas = await r.json();
    res = Array.isArray(filas) ? filas[0] : filas;
  }catch(e){
    errorLink('No pudimos confirmar ahora',
      'Probá de nuevo en un rato. Si sigue igual, escribinos a soporte@digiferia.ar.');
    return;
  }

  if(!res || !res.ok){
    errorLink('Este link no es válido',
      'Puede que sea viejo o que ya no exista esa suscripción. Podés anotarte de nuevo con la campanita 🔔 desde cualquier puesto.');
    return;
  }

  if(res.ya_estaba){
    pintar(`
      <div class="tarjeta festejo">
        <div class="emoji">👍</div>
        <h1>Tu email ya estaba confirmado</h1>
        <p class="sub">No hace falta que hagas nada más: ya recibís los avisos de lo que seguís.</p>
        <span class="mail">✉️ ${esc(res.email_visible)}</span>
        <a class="btn" href="https://digiferia.ar">🎪 Ir a la feria</a>
        <p class="chico">¿Preferís no recibir más? Al pie de cada email tenés el link para elegir o darte de baja.</p>
      </div>`);
    return;
  }

  pintar(`
    <div class="tarjeta festejo">
      <div class="emoji">🎉</div>
      <h1>¡Listo! Tu email quedó confirmado</h1>
      <p class="sub">Desde ahora te vamos a avisar cuando haya novedades de lo que seguís: fechas confirmadas, ofertas y más.</p>
      <span class="mail">✉️ ${esc(res.email_visible)}</span>
      <a class="btn" href="https://digiferia.ar">🎪 Empezar a pasear por la feria</a>
      <p class="chico">Podés dejar de recibirlos cuando quieras: al pie de cada email está el link para elegir qué te llega o darte de baja.</p>
    </div>`);
}

confirmar();
</script>
</body>
</html>
